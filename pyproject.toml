[project]
name = "planner-atlas"
version = "0.1.0"
description = "Optimization-induced failures in latent world models."
readme = "README.md"
license = "MIT"
requires-python = "==3.10.*"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.pytest]
testpaths = ["tests"]
