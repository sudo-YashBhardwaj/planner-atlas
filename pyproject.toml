[project]
name = "planner-atlas"
version = "0.1.0"
description = "Optimization-induced failures in latent world models."
readme = "README.md"
license = "MIT"
requires-python = "==3.10.*"
dependencies = [
    "gymnasium==1.3.0",
    "h5py==3.16.0",
    "imageio==2.37.4",
    "numpy==2.2.6",
    "opencv-python-headless==4.14.0.94",
    "pygame==2.6.1",
    "pymunk==7.3.0",
    "shapely==2.1.2",
    "stable-worldmodel==0.1.1",
    "torch==2.14.0",
    "transformers==5.8.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.pytest]
testpaths = ["tests"]
